    :root{

    *{box‑sizing:border‑box;margin:0;padding:0;}

      padding:24px 16px;
      max‑width:860px;
      margin:0 auto;
    }
    .lang‑wrap{
      display:flex;
      justify‑content:flex‑end;
      margin‑bottom:28px;
    }
    .lang‑select{
      background:var(--bg‑card);
      border:1px solid var(--border);
      color:var(--text‑primary);
      padding:6px 10px;
      border‑radius:6px;
      font‑size:14px;
      min‑width:160px;
    }
    .container{
      background:var(--bg‑card);
      border‑radius:14px;
      padding:28px 32px;
      border:1px solid var(--border);
    }
    h1{
      font‑size:26px;
      margin‑bottom:12px;
      background:linear‑gradient(90deg,var(--accent),var(--accent‑neon));
      ‑webkit‑background‑clip:text;
      color:transparent;
    }
    .hero‑desc{
      color:var(--text‑secondary);
      margin‑bottom:24px;
      padding‑bottom:14px;
      border‑bottom:1px solid var(--border);
    }
    h2{
      font‑size:18px;
      margin:28px 0 10px;
      color:#e2e6f5;
    }
    p{
      color:var(--text‑secondary);
      margin:10px 0;
    }
    a{
      color:var(--accent);
      text‑decoration:none;
    }
    a:hover{text‑decoration:underline;}
    .card‑grid{
      display:grid;
      grid‑template‑columns:repeat(auto‑fit,minmax(180px,1fr));
      gap:14px;
      margin:16px 0 24px;
    }
    .tip‑card{
      border:1px solid var(--border);
      border‑radius:10px;
      padding:14px;
      background:rgba(66,133,255,0.05);
    }
    .tip‑card h3{
      color:#fff;
      font‑size:15px;
      margin‑bottom:6px;
    }
    .tip‑card p{
      font‑size:13px;
      margin:0;
    }
    .faq‑item{
      border:1px solid var(--border);
      border‑radius:8px;
      margin‑bottom:10px;
    }
    .faq‑q{
      padding:12px 14px;
      cursor:pointer;
      display:flex;
      justify‑content:space‑between;
      align‑items:center;
      user‑select:none;
    }
    .faq‑q h3{
      font‑size:15px;
      color:#e2e6f5;
      font‑weight:500;
    }
    .faq‑a{
      padding:0 14px;
      max‑height:0;
      overflow:hidden;
      transition:max‑height 0.25s ease;
      color:var(--text‑secondary);
      font‑size:14px;
    }
    .faq‑item.open .faq‑a{
      padding:0 14px 14px;
      max‑height:1200px;
    }
    footer{
      margin‑top:36px;
      padding‑top:16px;
      border‑top:1px solid var(--border);
      color:var(--text‑secondary);
      font‑size:13px;
      text‑align:center;
    }
    footer a{margin:0 6px;}
    @media(max‑width:600px){
      .container{padding:20px 16px;}
      h1{font‑size:22px;}
    }
  </style>

    {q:"Mauvaise qualité après compression ?",a:"Augmentez manuellement le débit binaire et la résolution dans l’outil pour améliorer le rendu."},
    {q:"Résultat médiocre sur la suppression de voix ?",a:"Le rendu dépend de la source audio. Les morceaux entièrement mixés ne peuvent pas être séparés parfaitement ; préférez des sources stéréo."},
    {q:"Où sont stockés les fichiers générés ?",a:"Ils résident dans le bac à sable de l’application. Enregistrez‑les manuellement dans Fichiers / Photos. La désinstallation efface toutes ces données."},
    {q:"L’application plante ?",a:"Mettez iOS à jour. Les fichiers très volumineux peuvent causer des manques de mémoire, essayez de les fragmenter."},
    {q:"Comment demander un remboursement ?",a:"Tous les remboursements d’achats intégrés sont gérés par Apple. Faites votre demande depuis la page de commande App Store. Le développeur n’a aucun pouvoir de remboursement. Voir <a href='https://shamoshuisheng.github.io/subscription'>Contrat d’abonnement</a>"},
    {q:"Pro ne fonctionne pas sur mon nouvel appareil ?",a:"Appuyez sur « Restaurer les achats » et connectez‑vous avec votre compte Apple d’origine."}
  ],
  subscribeNote:`
<h2>Informations sur l’abonnement</h2>
<p>LumoConvert‑Pro débloque l’ensemble des outils premium. Veuillez lire notre <a href="https://shamoshuisheng.github.io/subscription">Contrat d’abonnement</a>.

const langList = [
  {code:"zh‑Hans",label:"简体中文"},
  {code:"zh‑Hant",label:"繁體中文"},
  {code:"en‑US",label:"English"},
  {code:"ja",label:"日本語"},
  {code:"ko",label:"한국어"},
  {code:"de‑DE",label:"Deutsch"},
  {code:"fr‑FR",label:"Français"}
];

const selectEl = document.getElementById("langSelect");
const pageEl = document.getElementById("pageContent");

langList.forEach(l=>{
  const opt = document.createElement("option");
  opt.value = l.code;
  opt.textContent = l.label;
  selectEl.appendChild(opt);
});

selectEl.onchange = function(){
  setLang(this.value);
};

function renderFaq(list){
  let html = "";
  list.forEach((item,idx)=>{
    html+=`
<div class="faq‑item" data‑idx="${idx}">
  <div class="faq‑q"><h3>${item.q}</h3><span>+</span></div>
  <div class="faq‑a"><p>${item.a}</p></div>
</div>
`;
  });
  return html;
}

function bindFaqClick(){
  document.querySelectorAll(".faq‑q").forEach(q=>{
    q.onclick = function(){
      const parent = this.closest(".faq‑item");
      parent.classList.toggle("open");
      this.querySelector("span").textContent = parent.classList.contains("open") ? "−" : "+";
    }
  })
}

function setLang(code){
  const t = i18n[code] ?? i18n["en‑US"];
  document.title = t.title + " | LumoConvert";
  document.documentElement.lang = code;
  selectEl.value = code;

  let cardHtml = `<div class="card‑grid">`;
  t.featureCards.forEach(c=>{
    cardHtml+=`<div class="tip‑card"><h3>${c.title}</h3><p>${c.desc}</p></div>`;
  })
  cardHtml += `</div>`;

  pageEl.innerHTML = `
<h1>${t.title}</h1>
<div class="hero‑desc">${t.heroDesc}</div>
<h2>${t.featureTitle}</h2>
${cardHtml}
<h2>${t.faqTitle}</h2>
${renderFaq(t.faqList)}
${t.subscribeNote}
`;
  localStorage.setItem("support_lang",code);
  bindFaqClick();
}

(function(){
  const saved = localStorage.getItem("support_lang");
  let match = "en‑US";
  if(saved && i18n[saved]){
    match = saved;
  }else{
    const brLang = navigator.language || navigator.userLanguage;
    if(brLang.startsWith("zh‑CN")) match="zh‑Hans";
    else if(brLang.startsWith("zh‑TW")||brLang.startsWith("zh‑HK")) match="zh‑Hant";
    else if(brLang.startsWith("ja")) match="ja";
    else if(brLang.startsWith("ko")) match="ko";
    else if(brLang.startsWith("de")) match="de‑DE";
    else if(brLang.startsWith("fr")) match="fr‑FR";
  }
  setLang(match);
})();
</script>
</body>
</html>
